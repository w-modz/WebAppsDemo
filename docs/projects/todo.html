<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Static todo demo." />
    <title>Todo App | WebApps Demo</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="brand" href="../index.html">WebApps Demo</a>
      <div class="nav-links">
        <a href="./todo.html">Todo App</a>
        <a href="./puzzle.html">Map Puzzle</a>
        <a href="./weather.html">Weather App</a>
      </div>
    </nav>

    <main class="project-page">
      <section class="todo-app">
        <header class="todo-header">
          <p class="eyebrow">Project A · Tasks stored locally</p>
          <h1>Todo List</h1>
          <p>Your tasks are saved in this browser, not on a server.</p>
        </header>

        <label class="todo-search">
          <span class="sr-only">Search tasks</span>
          <input id="search-input" type="search" placeholder="Search tasks..." aria-label="Search tasks" />
        </label>

        <p id="error" class="app-error" role="alert" hidden></p>

        <section class="task-list-container" aria-label="Tasks">
          <ul id="task-list" class="task-list"></ul>
        </section>

        <form id="task-form" class="add-task-form">
          <label class="sr-only" for="new-task">New task</label>
          <input id="new-task" type="text" placeholder="New task..." maxlength="255" required />
          <label class="sr-only" for="task-deadline">Deadline</label>
          <input id="task-deadline" type="datetime-local" required />
          <button type="submit">Add Task</button>
        </form>
      </section>
    </main>

    <script src="./todo.js"></script>
  </body>
</html>
