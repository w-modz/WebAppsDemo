<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Static map puzzle demo." />
    <title>Map Puzzle | WebApps Demo</title>
    <link rel="stylesheet" href="../styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="brand" href="../index.html">WebApps Demo</a>
      <div class="nav-links">
        <a href="./todo.html">Todo App</a>
        <a href="./puzzle.html">Map Puzzle</a>
        <a href="./weather.html">Weather App</a>
      </div>
    </nav>

    <main class="project-page">
      <section class="puzzle-app">
        <header class="puzzle-header">
          <p class="eyebrow">Project B · Interactive map</p>
          <h1>Map Puzzle</h1>
          <p>Choose a location, capture the map, and put the pieces back in order.</p>
        </header>

        <div class="puzzle-controls">
          <button type="button" id="location-button">My location</button>
          <button type="button" id="create-puzzle-button">Create puzzle</button>
          <button type="button" class="button-muted" id="toggle-map-button">Hide map</button>
          <label>
            <span class="sr-only">Puzzle size</span>
            <select id="puzzle-size">
              <option value="2">2 × 2</option>
              <option value="3">3 × 3</option>
              <option value="4">4 × 4</option>
            </select>
          </label>
          <span class="coordinates" id="coordinates">Click “My location” to get coordinates.</span>
        </div>

        <p id="puzzle-error" class="app-error" role="alert" hidden></p>

        <div id="map-frame" class="map-frame">
          <div id="map" class="map-canvas"></div>
        </div>

        <div id="puzzle-game" class="puzzle-game" hidden></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="./puzzle.js"></script>
  </body>
</html>
